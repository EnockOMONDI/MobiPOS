services:
  - type: web
    name: mobipos-web
    runtime: python
    buildCommand: pip install -r requirements/base.txt && npm ci && npm run css:build && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py check --deploy && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /health/ready/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: BACKGROUND_WORKERS_ENABLED
        value: "true"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_REQUIRED
        value: "true"
      - key: INTEGRATION_MODE
        value: disabled
      - key: PRIVILEGED_OTP_REQUIRED
        value: "false"
      - key: POS_AUTO_OPEN_SESSION
        value: "false"
      - key: EMAIL_DELIVERY_REQUIRED
        value: "true"
      - key: EMAIL_BACKEND
        value: apps.notifications.backends.OutboxEmailBackend
      - key: MAILERSEND_API_TOKEN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: MEDIA_STORAGE_REQUIRED
        value: "true"
      - key: MEDIA_STORAGE_BACKEND
        value: uploadcare
      - key: UPLOADCARE_PUBLIC_KEY
        sync: false
      - key: UPLOADCARE_SECRET_KEY
        sync: false
      - key: UPLOADCARE_SIGNED_UPLOADS
        value: "true"
      - key: UPLOADCARE_SIGNED_DELIVERY
        value: "true"
      - key: UPLOADCARE_SIGNING_SECRET
        sync: false
      - key: UPLOADCARE_CDN_BASE_URL
        sync: false
  - type: worker
    name: mobipos-worker
    runtime: python
    buildCommand: pip install -r requirements/base.txt
    startCommand: celery -A config worker -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: BACKGROUND_WORKERS_ENABLED
        value: "true"
      - key: EMAIL_DELIVERY_REQUIRED
        value: "true"
      - key: EMAIL_BACKEND
        value: apps.notifications.backends.OutboxEmailBackend
      - key: MAILERSEND_API_TOKEN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: INTEGRATION_MODE
        value: disabled
      - key: MEDIA_STORAGE_BACKEND
        value: uploadcare
      - key: MEDIA_STORAGE_REQUIRED
        value: "true"
      - key: UPLOADCARE_PUBLIC_KEY
        sync: false
      - key: UPLOADCARE_SECRET_KEY
        sync: false
      - key: UPLOADCARE_SIGNED_UPLOADS
        value: "true"
      - key: UPLOADCARE_SIGNED_DELIVERY
        value: "true"
      - key: UPLOADCARE_SIGNING_SECRET
        sync: false
      - key: UPLOADCARE_CDN_BASE_URL
        sync: false
      - key: SENTRY_REQUIRED
        value: "true"
      - key: SENTRY_DSN
        sync: false
      - key: BACKUP_ENABLED
        value: "false"
      - key: BACKUP_SOURCE_DATABASE_URL
        sync: false
      - key: BACKUP_STORAGE_BACKEND
        value: supabase
      - key: BACKUP_SUPABASE_URL
        sync: false
      - key: BACKUP_SUPABASE_SERVICE_KEY
        sync: false
      - key: BACKUP_SUPABASE_BUCKET
        value: database-backups
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_RESTORE_DRILL_ENABLED
        value: "false"
      - key: BACKUP_RESTORE_DATABASE_URL
        sync: false
      - key: BACKUP_RESTORE_PROJECT_REF
        sync: false
  - type: worker
    name: mobipos-scheduler
    runtime: python
    buildCommand: pip install -r requirements/base.txt
    startCommand: celery -A config beat -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: BACKGROUND_WORKERS_ENABLED
        value: "true"
      - key: INTEGRATION_MODE
        value: disabled
      - key: MEDIA_STORAGE_BACKEND
        value: uploadcare
      - key: MEDIA_STORAGE_REQUIRED
        value: "true"
      - key: UPLOADCARE_PUBLIC_KEY
        sync: false
      - key: UPLOADCARE_SECRET_KEY
        sync: false
      - key: UPLOADCARE_SIGNED_UPLOADS
        value: "true"
      - key: UPLOADCARE_SIGNED_DELIVERY
        value: "true"
      - key: UPLOADCARE_SIGNING_SECRET
        sync: false
      - key: UPLOADCARE_CDN_BASE_URL
        sync: false
      - key: SENTRY_REQUIRED
        value: "true"
      - key: SENTRY_DSN
        sync: false
      - key: BACKUP_ENABLED
        value: "false"
      - key: BACKUP_SOURCE_DATABASE_URL
        sync: false
      - key: BACKUP_STORAGE_BACKEND
        value: supabase
      - key: BACKUP_SUPABASE_URL
        sync: false
      - key: BACKUP_SUPABASE_SERVICE_KEY
        sync: false
      - key: BACKUP_SUPABASE_BUCKET
        value: database-backups
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_RESTORE_DRILL_ENABLED
        value: "false"
      - key: BACKUP_RESTORE_DATABASE_URL
        sync: false
      - key: BACKUP_RESTORE_PROJECT_REF
        sync: false
