services:
  - type: web
    name: mobipos-web
    runtime: python
    buildCommand: pip install -r requirements/base.txt && npm ci && npm run css:build && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py check --deploy && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /health/ready/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BACKGROUND_WORKERS_ENABLED
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: INTEGRATION_MODE
        value: disabled
      - key: PRIVILEGED_OTP_REQUIRED
        value: "false"
      - key: POS_AUTO_OPEN_SESSION
        value: "false"
      - key: EMAIL_DELIVERY_REQUIRED
        value: "false"
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: MEDIA_STORAGE_REQUIRED
        value: "false"
      - key: MEDIA_STORAGE_BACKEND
        sync: false
      - key: UPLOADCARE_PUBLIC_KEY
        sync: false
      - key: UPLOADCARE_SECRET_KEY
        sync: false
      - key: UPLOADCARE_SIGNED_UPLOADS
        value: "false"
      - key: UPLOADCARE_SIGNED_DELIVERY
        value: "false"
      - key: UPLOADCARE_SIGNING_SECRET
        sync: false
      - key: UPLOADCARE_CDN_BASE_URL
        value: https://ucarecdn.com
  - type: worker
    name: mobipos-worker
    runtime: python
    buildCommand: pip install -r requirements/base.txt
    startCommand: celery -A config worker -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BACKGROUND_WORKERS_ENABLED
        value: "true"
      - key: INTEGRATION_MODE
        value: disabled
      - key: MEDIA_STORAGE_BACKEND
        sync: false
      - key: UPLOADCARE_PUBLIC_KEY
        sync: false
      - key: UPLOADCARE_SECRET_KEY
        sync: false
  - type: worker
    name: mobipos-scheduler
    runtime: python
    buildCommand: pip install -r requirements/base.txt
    startCommand: celery -A config beat -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BACKGROUND_WORKERS_ENABLED
        value: "true"
      - key: INTEGRATION_MODE
        value: disabled
      - key: MEDIA_STORAGE_BACKEND
        sync: false
      - key: UPLOADCARE_PUBLIC_KEY
        sync: false
      - key: UPLOADCARE_SECRET_KEY
        sync: false
