{% extends "base.html" %}
{% block title %}Add role | Kipekee Access{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold">Add role</h1>
<p class="mt-2 text-slate-600">Build a least-privilege role, then assign it to organization users.</p>
<form method="post" class="mt-6 max-w-3xl space-y-4 rounded-xl border bg-white p-6 shadow-sm">
  {% csrf_token %}{{ form.as_p }}
  <button class="rounded-lg bg-red-700 px-5 py-3 text-white" type="submit">Create role</button>
</form>
{% endblock %}
