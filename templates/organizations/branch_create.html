{% extends "base.html" %}
{% block title %}Add branch | Kipekee Access{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold">Add branch</h1>
<p class="mt-2 text-slate-600">Branch creation is controlled by the active subscription plan.</p>
<form method="post" class="mt-6 max-w-2xl space-y-4 rounded-xl border bg-white p-6 shadow-sm">
  {% csrf_token %}{{ form.as_p }}
  <button class="rounded-lg bg-red-700 px-5 py-3 text-white" type="submit">Create branch</button>
</form>
{% endblock %}
