{% extends "base.html" %}
{% block title %}Add customer or supplier | Kipekee Access{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold">Add customer or supplier</h1>
<form method="post" class="mt-6 max-w-3xl space-y-4 rounded-xl border bg-white p-6 shadow-sm">
  {% csrf_token %}{{ form.as_p }}
  <button class="rounded-lg bg-red-700 px-5 py-3 text-white" type="submit">Save contact</button>
</form>
{% endblock %}
