{% extends "base.html" %}
{% block title %}Recovery codes | MobiPOS{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl rounded-2xl border bg-white p-8 shadow-sm"><h1 class="text-2xl font-bold">Save your recovery codes</h1><p class="mt-2 text-slate-600">Each code can be used once when your authenticator is unavailable. Store them securely.</p><div class="mt-5 grid grid-cols-2 gap-2 rounded-xl bg-slate-950 p-5 font-mono text-white">{% for code in codes %}<span>{{ code }}</span>{% endfor %}</div><a href="{% url 'security-settings' %}" class="mt-6 inline-block rounded-xl bg-red-700 px-4 py-2.5 font-semibold text-white">I saved these codes</a></div>
{% endblock %}
