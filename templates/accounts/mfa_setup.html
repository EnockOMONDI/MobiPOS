{% extends "base.html" %}
{% block title %}Set up MFA | MobiPOS{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl rounded-2xl border bg-white p-8 shadow-sm"><h1 class="text-2xl font-bold">Set up two-factor authentication</h1><p class="mt-2 text-slate-600">Add this account to your authenticator app, then enter its current six-digit code.</p><div class="mt-5 break-all rounded-xl bg-slate-950 p-4 font-mono text-xs text-white">{{ device.config_url }}</div><form method="post" class="mt-6 space-y-4">{% csrf_token %}{{ form.as_p }}<button class="rounded-xl bg-red-700 px-4 py-2.5 font-semibold text-white">Verify and enable MFA</button></form></div>
{% endblock %}
