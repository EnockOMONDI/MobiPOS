<section class="card p-5 sm:p-6">
  <h2 class="text-lg font-bold text-slate-950">Activity history</h2>
  <div class="mt-4 space-y-4">
    {% for event in activity %}
    <div class="relative border-l-2 border-slate-200 pl-4">
      <span class="absolute -left-[5px] top-1 size-2 rounded-full bg-red-600"></span>
      <p class="text-sm font-semibold text-slate-800">{{ event.action|title }}</p>
      <p class="mt-1 text-xs text-slate-500">{{ event.actor|default:"System" }} · {{ event.created_at }}</p>
    </div>
    {% empty %}<p class="text-sm text-slate-500">No activity recorded yet.</p>{% endfor %}
  </div>
</section>
