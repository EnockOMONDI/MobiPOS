<div class="space-y-2">
  <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-slate-700">{{ field.label }}{% if field.field.required %}<span class="text-red-700"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="text-xs leading-5 text-slate-500">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div class="text-sm font-semibold text-red-700">{{ field.errors }}</div>{% endif %}
</div>
