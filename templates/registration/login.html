{% extends "base.html" %}

{% block title %}Sign in | MobiPOS{% endblock %}

{% block anonymous_content %}
  <div class="mx-auto max-w-md rounded-xl border bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold">Sign in</h1>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full rounded-lg bg-red-700 px-4 py-3 font-medium text-white">
        Sign in
      </button>
    </form>
    <div class="mt-6 flex justify-between text-sm">
      <a class="font-medium text-red-700" href="{% url 'password-reset' %}">Forgot password?</a>
      <a class="font-medium text-red-700" href="{% url 'register-organization' %}">Register organization</a>
    </div>
  </div>
{% endblock %}
