{% extends "base.html" %}

{% block title %}Register organization | Kipekee Access{% endblock %}

{% block anonymous_content %}
  <div class="mx-auto max-w-xl rounded-xl border bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold">Create your organization</h1>
    <p class="mt-2 text-slate-600">Start a pending Kipekee Access tenant for platform approval.</p>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full rounded-lg bg-red-700 px-4 py-3 font-medium text-white">Register organization</button>
    </form>
  </div>
{% endblock %}
