{% extends "base.html" %}
{% block title %}New purchase | Kipekee Access{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold">New purchase order</h1>
<form method="post" class="mt-6 max-w-2xl space-y-4 rounded-xl border bg-white p-6 shadow-sm">
  {% csrf_token %}{{ form.as_p }}
  <button class="rounded-lg bg-red-700 px-5 py-3 font-medium text-white" type="submit">Create purchase order</button>
</form>
{% endblock %}
