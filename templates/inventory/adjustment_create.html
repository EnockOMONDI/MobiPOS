{% extends "base.html" %}
{% block title %}Stock adjustment | Kipekee Access{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold">Request stock adjustment</h1>
<p class="mt-2 text-slate-600">Stock changes require an owner-approved, auditable ledger movement.</p>
<form method="post" class="mt-6 max-w-2xl space-y-4 rounded-xl border bg-white p-6 shadow-sm">
  {% csrf_token %}{{ form.as_p }}
  <button class="rounded-lg bg-red-700 px-5 py-3 text-white" type="submit">Submit adjustment</button>
</form>
{% endblock %}
